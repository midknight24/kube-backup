#@ load("@ytt:data", "data")
#@yaml/text-templated-strings

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backup-role
  namespace: (@= data.values.namespace @)
rules:
- apiGroups:
    - ""
  resources:
    - "pods"
  verbs:
    - "get"
    - "list"
    - "watch"
- apiGroups:
    - "apps"
  resources:
    - "deployments"
    - "statefulsets"
    - "daemonsets"
    - "deployments/scale"
    - "statefulsets/scale"
    - "replicasets"
  verbs:
    - "create"
    - "delete"
    - "patch"
    - "update"
    - "get"
    - "list"
    - "watch"
- apiGroups:
  - "argoproj.io"
  resources:
    - "workflowtaskresults"
  verbs:
    - "create"
    - "patch"