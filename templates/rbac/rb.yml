#@ load("@ytt:data", "data")
#@yaml/text-templated-strings

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-rolebinding
  namespace: (@= data.values.namespace @)
subjects:
- kind: ServiceAccount
  name: backup-sa
  namespace: (@= data.values.namespace @)
roleRef:
  kind: Role
  name: backup-role
  apiGroup: rbac.authorization.k8s.io